spring:
  application:
    name: gyuill-kim
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sopt_assignment}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    try-it-out-enabled: true

jwt:
  issuer: ${JWT_ISSUER:gyuill-kim}
  secret: ${JWT_SECRET:local-development-secret-key-that-should-be-overridden}
  access-token-validity-in-milliseconds: ${JWT_ACCESS_TOKEN_VALIDITY:3600000}
  refresh-token-validity-in-milliseconds: ${JWT_REFRESH_TOKEN_VALIDITY:1209600000}
  clock-skew-in-seconds: ${JWT_CLOCK_SKEW:60}

refresh-token:
  hash-secret: ${REFRESH_TOKEN_HASH_SECRET:local-refresh-token-hash-secret-that-should-be-overridden}
